<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Celestial_Game</title>
    <script type="importmap">
    {
        "imports": {
            "engine/": "../engine/",
            "dat": "../lib/dat.js",
            "glm": "../lib/glm.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fullscreen no-touch pixelated">
        <canvas></canvas>
    </div>

    <!-- Start screen-->
     <div id="start-screen" class="overlay-screen">
        <h1>Celestial Combat</h1>
        <button id="start-button">Fight</button>
    </div>

    <!--Game Over Screen-->
    <div id="game-over-screen" class="overlay-screen hidden">
        <h1 id="gameover-message"></h1>
        <button id="restart-button">Back</button>
    </div>

    <!--Health bars-->
    <div id="player-health-bar" class="healthbar left"></div>
    <div id="npcZemlja-health-bar" class="healthbar right"></div>

    <!--Control instructions-->
    <div id="controls-popup" class="hidden">
    <div class="popup-content">
        <h2>Controls</h2>
        
        <p>A/D – Move Left/Right</p>
        <p>W+D – Front Flip</p>
        <p>W+A – Back Flip</p>
        <p>E – Punch</p>
        <p>R – Super punch</p>
        <p>F – Kick</p>
        <p>Q – Block</p>

        <button id="close-popup">Start Fight</button>
    </div>
   </div>

   <div id="fight-overlay">FIGHT</div>

   <audio id="fight-sound" src="./sounds/fight.mp3"></audio>

</body>
</html>
